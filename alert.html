<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Alert Interaction</title>
</head>

<body>

    <h1>JavaScript Interaction Example</h1>

    <p>Click the button to see an alert message.</p>

    <!-- Button -->
    <button onclick="showAlert()">Click Me</button>

    <!-- JavaScript Code -->
    <script>
        function showAlert() {
            alert("Hello! You clicked the button 🎉");
        }
    </script>

</body>
</html>
