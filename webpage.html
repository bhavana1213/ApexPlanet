<!DOCTYPE html>
<html>
<head>
    <title>Basic Web Development Project</title>

    <!-- CSS START -->
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #6b61f3;
            text-align: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
        }

        section {
            background-color: rgb(205, 215, 69);
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        img {
            width: 300px;
            border-radius: 10px;
            margin-top: 10px;
        }

        a {
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: red;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: green;
            color: rgb(37, 181, 102);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: rgb(82, 100, 0);
        }

        footer {
            background-color: #ab2626;
            color: #1e9fbc;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
    <!-- CSS END -->

</head>

<body>

    <!-- HTML START -->

    <header>
        <h1>My First Web Development Project</h1>
        <p>HTML + CSS + JavaScript</p>
    </header>

    <section>
        <h2>About HTML</h2>
        <p>HTML is used to create the structure of a webpage.</p>

        <h2>Image Example</h2>
        <img src="https://via.placeholder.com/300" alt="Sample Image">

        <h2>Useful Link</h2>
        <p>
            Visit 
            <a href="https://www.google.com" target="_blank">Google</a>
        </p>

        <h2>JavaScript Interaction</h2>
        <p>Click the button to see an alert message.</p>

        <button onclick="showMessage()">Click Me</button>
    </section>

    <footer>
        <p>© 2026 Basic Web Development Project</p>
    </footer>

    <!-- HTML END -->

    <!-- JAVASCRIPT START -->
    <script>
        function showMessage() {
            alert("Hello! You clicked the button 🎉");
        }
    </script>
    <!-- JAVASCRIPT END -->

</body>
</html>
